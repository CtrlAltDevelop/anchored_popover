name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter the pubspec claims to support, and the newest one.
        # A package that only ever builds on the latest stable should say so in
        # its constraints.
        flutter: ['3.44.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Goldens are skipped here on purpose: they are rendered images, and
      # rendering differs between Flutter versions and platforms. See
      # dart_test.yaml.
      - run: flutter test --coverage
      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Every line of lib/ is covered, and stays covered
        run: |
          python3 - <<'PY'
          import sys
          total = hit = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('DA:'):
                  total += 1
                  hit += line.strip()[3:].split(',')[1] != '0'
          print(f'{hit}/{total} lines covered')
          if hit != total:
              print('::error::coverage is no longer 100%')
              sys.exit(1)
          PY
      - uses: codecov/codecov-action@v4
        if: matrix.flutter == 'stable'
        with:
          files: coverage/lcov.info
        continue-on-error: true

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - name: Score the package the way pub.dev does
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
