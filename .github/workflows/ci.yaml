name: ci

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Goldens are skipped here on purpose: they are rendered images, and
      # rendering differs between Flutter versions and platforms. See
      # dart_test.yaml.
      - run: flutter test
      # pana shells out to these to validate the pubspec's screenshots. Without
      # them every screenshot check reports a missing file and the score drops
      # by 10 points for a problem the package does not have.
      - name: Install libwebp, which pana needs for the screenshots
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Score the package the way pub.dev does
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
