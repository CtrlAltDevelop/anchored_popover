name: anchored_popover
description: >-
  A popover that anchors to a widget instead of the screen. It follows its
  anchor as the list scrolls, flips and clamps to stay on screen, and fades
  itself back out.
version: 1.0.0
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/anchored_popover
issue_tracker: https://github.com/CtrlAltDevelop/anchored_popover/issues

topics:
  - popover
  - overlay
  - tooltip
  - popup
  - context-menu

screenshots:
  - description: >-
      A row's actions, in a popover anchored to the row rather than to the
      screen.
    path: doc/screenshot.png
  - description: The same popover in a dark theme.
    path: doc/screenshot_dark.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
